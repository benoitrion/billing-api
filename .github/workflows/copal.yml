# Copal in this repository's own CI: questions and a reviewer guide on each pull request,
# a weekly team report every Monday, and the readiness diagnostic on demand (Actions › copal › Run workflow).
name: copal
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      mode: { description: "weekly or readiness", default: readiness }

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  copal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: benoitrion/copal-sandbox/actions/program@main
        with:
          mode: ${{ inputs.mode || 'auto' }}
          track: legacy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
